[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veloshot"
version = "1.0.0"
description = "Independent Qt screenshot and annotation application inspired by Flameshot"
readme = "README.md"
license = "MIT"
authors = [{ name = "prezdev88" }]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7"]
keywords = ["screenshot", "annotation", "desktop", "qt", "x11"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]

[project.urls]
Homepage = "https://github.com/prezdev88/veloshot"
Repository = "https://github.com/prezdev88/veloshot.git"
Issues = "https://github.com/prezdev88/veloshot/issues"

[project.scripts]
veloshot = "veloshot.__main__:main"

[tool.setuptools.packages.find]
include = ["veloshot*"]
